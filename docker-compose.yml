# GlobeGuard full stack (decision A3: the canonical runtime) - Postgres 16, Redis 7,
# Vendure server + worker, Next.js storefront. Lives in C:\GlobeGuard\ next to both repos.
#
#   copy .env.example -> .env and fill in the secrets (never commit .env)
#   docker compose build                # ~5-15 min: two npm ci + tsc/vite/next builds
#
# First boot on an EMPTY database (order matters - the catalog seed must finish before the worker
# starts reindexing; the old TypeORM synchronize race, PROJECT-CONTEXT 7.4.5, is gone now that the
# schema comes from the baseline migration applied by the server service alone):
#   1. .env: SEED_CATALOG=true
#   2. docker compose up -d --wait postgres redis server   # server ALONE: migrate + catalog seed
#   3. docker compose logs -f server                       # wait for "[CatalogSeeder] Catalog seed finished"
#   4. docker compose up -d worker frontend                # worker runs the queued search reindex
#   5. .env: SEED_CATALOG=false, then `docker compose up -d` again
#      (SEED_CATALOG=true re-upserts from data/* on EVERY boot and overwrites dashboard product edits)
# Later boots: docker compose up -d --wait   (worker waits for the server healthcheck by itself)
#
# URLs: storefront http://localhost:3100, dashboard http://localhost:3000/dashboard (login SUPERADMIN_*),
#       shop API http://localhost:3000/shop-api, health http://localhost:3000/health
#
# Dev-mailbox caveat: the server runs with APP_ENV=production, which DISABLES the /mailbox dev
# mailbox; without SENDGRID_API_KEY every e-mail (verification links included) is rendered and
# discarded, so registration cannot complete. For local flow tests set APP_ENV=development in .env
# (mailbox at http://localhost:3000/mailbox) or provide a SendGrid key.
#
# Other notes
# - NEXT_PUBLIC_* values are baked into the frontend image at build time (build args below):
#   change one -> `docker compose build frontend`. VENDURE_* / REVALIDATION_SECRET are runtime env.
# - Product images need no configuration. ASSET_URL_PREFIX is the storefront's own origin
#   (localhost:3100) and the frontend rewrites /assets/* to the server container, so the one URL
#   works in the browser AND inside the frontend container, where next/image fetches it
#   server-side. Pointing ASSET_URL_PREFIX straight at localhost:3000 does NOT work: verified in
#   the running stack, http://server:3000/health answers 200 from the frontend container while
#   http://localhost:3000/health does not, so every image would 400.
#   A fresh database has no images at all - run `npm run sync:product-assets` in the backend
#   once (it pulls them from the live beta), see ONBOARDING.md.
#   In production none of this applies: the supervisor serves /assets on the storefront's own
#   origin, so one public URL is correct everywhere.
# - The backend repo's own docker-compose.yml is the dev-deps helper (Postgres on host 6544,
#   Redis 6379): both stacks bind Redis 6379, do not run them at the same time.
# - Mollie webhooks cannot reach localhost: for an end-to-end payment test expose :3000 through a
#   tunnel and set VENDURE_HOST to that public URL.
# - Booted end to end on 2026-09-22 against Docker Desktop 29.8.0 (WSL2): both images build, the
#   server migrates and seeds, all five services report healthy. New here? Read ONBOARDING.md.
name: globeguard

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  # The image runs APP_ENV=production, so the schema comes from src/migrations/* (the server
  # service applies them before it boots), never from TypeORM synchronize. Setting this to true
  # together with APP_ENV=production is refused by vendure-config.ts and the container exits.
  DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
  PORT: "3000"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: globeguard
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_SSL: "false"
  # REDIS_DISABLED=true boots without RedisCachePlugin (the redis container may then be stopped).
  REDIS_DISABLED: ${REDIS_DISABLED:-false}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
  SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
  COOKIE_SECRET: ${COOKIE_SECRET}
  # Storefront origin: e-mail links, Mollie fallback redirect, blog JSON-LD.
  FRONTEND_BASE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
  EMAIL_BASE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
  # Public origin of the backend: Mollie POSTs webhooks to <VENDURE_HOST>/payments/mollie/...
  VENDURE_HOST: ${VENDURE_HOST:-http://localhost:3000}
  # Asset URLs must be reachable from the browser, not just inside the compose network.
  # The storefront serves these itself and rewrites them to this container (see the frontend
  # service). Point it at the backend directly only if you also make that URL reachable from
  # inside the frontend container.
  ASSET_URL_PREFIX: ${ASSET_URL_PREFIX:-http://localhost:3100/assets/}
  # Empty = "Online bezahlen" not provisioned / e-mails discarded (both values are trimmed).
  MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-info@globeguard.ch}
  # Decision A10: Bexio local-only, CUPS gated (CUPS_SERVER_URL deliberately not set: it would
  # add a /health indicator that reports 503 without a print server).
  BEXIO_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: globeguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globeguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional cache. Keep it running unless REDIS_DISABLED=true in .env.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build: ./globeguard-backend
    image: globeguard-server:local
    # Migrations first, in the one service that owns the schema. On an empty database the baseline
    # creates all 89 tables; on a later boot it is a no-op. A failed migration exits non-zero and
    # the container stops instead of starting a server against a half-migrated schema.
    command: ["sh", "-c", "node dist/migrate.js && node dist/index.js"]
    environment:
      <<: *backend-env
      SEED_CATALOG: ${SEED_CATALOG:-false}
    ports:
      - "3000:3000"
    volumes:
      - backend_assets:/app/static/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # CupsPlugin is gated behind CUPS_SERVER_URL, so /health reflects only the database.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s
    restart: unless-stopped

  # Same image, job queue. Starts only after the server is healthy (synchronize race) and
  # never seeds.
  worker:
    image: globeguard-server:local
    command: ["node", "dist/index-worker.js"]
    environment:
      <<: *backend-env
      SEED_CATALOG: "false"
    volumes:
      - backend_assets:/app/static/assets
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./globeguard-frontend
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-GlobeGuard}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
        # Hostname (no protocol) that serves Vendure assets over https; empty for localhost.
        NEXT_PUBLIC_ASSET_HOST: ${NEXT_PUBLIC_ASSET_HOST:-}
        # Product images: ASSET_URL_PREFIX points at the storefront's own origin and Next rewrites
        # /assets/* to the backend container. That is the only arrangement where one URL works both
        # in the browser (localhost:3100 is published) and inside this container (where localhost is
        # the container itself, so localhost:3000 is nothing). Neither is set in production.
        VENDURE_ASSET_ORIGIN: http://server:3000
        ALLOW_LOCAL_IMAGE_HOSTS: "true"
    image: globeguard-frontend:local
    environment:
      VENDURE_SHOP_API_URL: http://server:3000/shop-api
      VENDURE_CHANNEL_TOKEN: ${VENDURE_CHANNEL_TOKEN:-__default_channel__}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
      # robots.txt is evaluated per request from this runtime value ("beta." = disallow all).
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
    ports:
      - "3100:3100"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_assets:
